name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  workflow-lint:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        run: actionlint

  pr-title:
    name: Pull Request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate title
        run: npm run ci:pr-title

  static:
    name: Project structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate project structure
        run: python3 scripts/ci/validate-tauri-project.py --project . --mode static

  delivery-scripts:
    name: Delivery scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          bash -n scripts/linux/build-cloudpanel-release.sh
          bash -n scripts/linux/build-cloudpanel-release-docker.sh
          bash -n scripts/linux/install-cloudpanel-build-deps.sh
          bash -n deploy/cloudpanel/start.sh
          bash -n deploy/cloudpanel/stop.sh
          bash -n deploy/cloudpanel/restart.sh
          bash -n deploy/cloudpanel/status.sh
          bash -n deploy/cloudpanel/check.sh
          bash -n deploy/cloudpanel/cli.sh
          bash -n deploy/cloudpanel/worker.sh
          bash -n deploy/cloudpanel/ports.sh

      - name: Validate Node.js delivery scripts
        run: |
          node --check scripts/ci/run-tauri.mjs
          node --check scripts/release/collect-release-assets.mjs
          node --check scripts/release/upload-release-assets.mjs
          node --check scripts/release/prepare-release.mjs
          node --check scripts/release/run-semantic-release.mjs

  windows-build-script:
    name: Windows build script
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/windows/build-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  frontend:
    name: Vue, TypeScript and Web/PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate version synchronization
        run: npm run ci:version

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web/PWA
        run: npm run build:web

      - name: Store Web/PWA for Rust checks
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  rust:
    name: Rust and Tauri
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Web/PWA for Tauri context
        uses: actions/download-artifact@v8
        with:
          name: ci-web-dist
          path: dist

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Resolve Cargo lockfile
        run: test -f src-tauri/Cargo.lock

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

  rust-features:
    name: Rust feature ${{ matrix.label }}
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: SQLite
            features: desktop
          - label: MySQL
            features: desktop,mysql-db
          - label: PostgreSQL
            features: desktop,postgres-db
          - label: MySQL and PostgreSQL
            features: desktop,mysql-db,postgres-db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Web/PWA for Tauri context
        uses: actions/download-artifact@v8
        with:
          name: ci-web-dist
          path: dist

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: features-${{ matrix.features }}
          cache-on-failure: true

      - name: Resolve Cargo lockfile
        run: test -f src-tauri/Cargo.lock

      - name: Check database feature
        run: >-
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          --no-default-features --features "${{ matrix.features }}"

  legacy-migration:
    name: Legacy SQLite migration and bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run executable migration scenarios
        run: >-
          cargo run --manifest-path tests/legacy-migration-harness/Cargo.toml
          --locked
